# 3시간마다 RSS 수집 → 데이터 커밋 → GitHub Pages 배포
name: collect-and-deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # UTC 기준 3시간마다 (정각 혼잡 피해서 17분)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["index.html", "dashboard.html", "*.py", "data/translations.json", "assets/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS 수집·분석
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 없으면 AI 요약만 건너뜀
        run: python collect.py

      - name: 누적 데이터 커밋
        run: |
          git config user.name "trend-edit-bot"
          git config user.email "trend-edit-bot@users.noreply.github.com"
          git add data/store.json data/data.js
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC 수집"
          git push

      - name: 배포 파일 준비
        run: |
          mkdir -p _site/data _site/assets
          cp index.html dashboard.html _site/
          cp data/data.js _site/data/
          cp assets/*.png _site/assets/

      - name: 공유 썸네일 생성 (그 시점 TOP 3 이슈 반영)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --allow-file-access-from-files --force-device-scale-factor=1 \
            --window-size=1200,630 --virtual-time-budget=10000 \
            --screenshot="$PWD/_site/assets/og.png" "file://$PWD/assets/og.html" || echo "썸네일 생성 실패 - 기본 이미지 사용"
          # 카카오톡 등이 예전 이미지를 계속 보여 주지 않도록 주소에 버전 번호를 붙임
          sed -i "s#assets/og.png#assets/og.png?v=${GITHUB_RUN_ID}#g" _site/index.html _site/dashboard.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
